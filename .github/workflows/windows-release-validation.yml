name: Windows release validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-validation:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CI: "1"
      NO_COLOR: "1"
    steps:
      - name: Check out clean source
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/setup@v2
        with:
          version: 11.16.0
          install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.1
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      # Packaging builds the native MCP shim; the version comes from its rust-toolchain.toml.
      - name: Install the pinned Rust toolchain
        working-directory: apps/desktop/native/mcp-shim
        run: rustup toolchain install

      # ...and the host, root launcher and setup from the desktop workspace.
      - name: Install the pinned Rust toolchain for the desktop workspace
        working-directory: apps/desktop/native
        run: rustup toolchain install

      - name: Install the Playwright browser
        run: pnpm exec playwright install chromium

      # install-drill's 2.x ⇄ 3.0 scenarios need a 2.0-era drill package (its setup has the sandbox);
      # it is built from the 2.0.0 commit in a temporary worktree under output/.
      - name: Build the 2.0 drill package
        run: pnpm exec tsx scripts/build-drill-package-20.ts

      # A fresh runner is a clean machine: the installed half of distribution-smoke registers the real
      # uninstall entry, Start menu and keepalive task, so it runs only where this is declared.
      - name: Run full E2E, package, distribution, install drill, budget and power-loss validation
        env:
          ATM_DISTRIBUTION_CLEAN_MACHINE: "1"
        run: pnpm release --full

      - name: Upload release validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-validation-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            release/
            output/release-verification.json
            output/release-logs/
            output/e2e/results.json
            output/package/candidate-binaries.json
            output/drill/report.json
            output/budget-report.json
            output/power-loss/report.json
            output/packaged-smoke-report.json
            output/portable-smoke-report.json
            output/installed-smoke-report.json
            output/distribution-smoke-report.json
            playwright-report/
            test-results/
