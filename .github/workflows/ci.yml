name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 11.16.0
          install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The native MCP shim is built, linted and tested from pnpm test; the version comes
      # from its rust-toolchain.toml.
      - name: Install the pinned Rust toolchain
        working-directory: apps/desktop/native/mcp-shim
        run: rustup toolchain install
      # Host, root launcher and setup: their own workspace and toolchain file.
      - name: Install the pinned Rust toolchain for the desktop workspace
        working-directory: apps/desktop/native
        run: rustup toolchain install
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Check the desktop native workspace
        working-directory: apps/desktop/native
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy -p atm-setup --features drill --all-targets --locked -- -D warnings
          cargo clippy -p atm-host --features smoke --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - run: pnpm test
      - run: pnpm build
