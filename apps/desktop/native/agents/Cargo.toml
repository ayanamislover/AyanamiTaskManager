[package]
name = "atm-agents"
version = "0.0.0"
description = "ATM 3 Agent integration: MCP client configs, rule block, skills, profile switch, docs install and the repair job"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
atm-domain = { path = "../domain" }
serde_json = { workspace = true }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }

[dev-dependencies]
# 独立的 TOML 解析器：核对改写后的 Codex 配置仍是合法 TOML（peer W6 r2 P1-02），不进产品。
toml = "0.8"
