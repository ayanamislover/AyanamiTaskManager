[package]
name = "atm-host"
version = "0.0.0"
description = "AyanamiTaskManager desktop host (WebView2 window, tray, the in-process ATM 3 service)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "AyanamiTaskManager"
path = "src/main.rs"

[features]
# 测试构建：允许 CDP 调试端口与 smoke 钩子。生产构建永远不带（de-electron §5）。
smoke = ["atm-install-state/smoke"]

[dependencies]
# 只为编译期的发布守卫（E2E_SURFACE）：主体由 ui-bridge 构造，宿主自己不构造。
atm-domain = { path = "../domain" }
atm-install-state = { path = "../install-state" }
# W5a：服务在宿主进程里（不再拉起 Node core）。
atm-runtime = { path = "../runtime" }
# W5e：WebView 的界面请求在进程内分发。
atm-ui-bridge = { path = "../ui-bridge" }
serde.workspace = true
# W5g lifecycle：错误消息只留指纹、runId 散列。
sha2 = "0.10"
serde_json.workspace = true
tao = "0.35"
wry = "0.55"
tray-icon = "0.24"
# 与 wry 0.55 同版本：直接挂 WebView2 的 frame 事件（webview_frames.rs）。
webview2-com = "0.38"
# 与 webview2-com 同一版本；只开 toast 所需的 WinRT 面。
windows = { version = "0.61", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_System_Com", "Win32_UI_Shell"] }
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_System_RemoteDesktop",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Pipes",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_IO",
  "Win32_System_LibraryLoader",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
atm-build-support = { path = "../build-support" }
