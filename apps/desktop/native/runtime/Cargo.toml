[package]
name = "atm-runtime"
version = "0.0.0"
description = "ATM 3 headless runtime: admission, conversion, authority, Agent entries and jobs"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

# 开发用的无头二进制（W4i）：只给端到端用例与本机联调用，不进安装包。正式宿主（atm-host，W5a 起）链接同一个库。
[[bin]]
name = "atm-runtime"
path = "src/main.rs"

# W7e 崩溃演练当作 claude 拉起的假程序：与 atm-dispatch 用例同一个源文件，本包的用例才拿得到它的路径
# （`CARGO_BIN_EXE_atm-drill-claude`）。同样不进安装包。
[[bin]]
name = "atm-drill-claude"
path = "../dispatch/src/bin/fake_claude.rs"

[dependencies]
atm-dispatch = { path = "../dispatch" }
atm-domain = { path = "../domain" }
atm-http = { path = "../http" }
atm-install-state = { path = "../install-state" }
atm-jobs = { path = "../jobs" }
atm-service = { path = "../service" }
atm-store = { path = "../store" }
# W7b：手机同步的密钥（DPAPI、secrets.dpapi.json）。
atm-sync = { path = "../sync" }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  # 假 claude（atm-drill-claude）看自己有没有控制台、启动信息里的窗口显示方式。
  "Win32_System_Console",
  "Win32_System_Threading",
] }

[target.'cfg(windows)'.dev-dependencies]
# 自检的用例自己加密：带与不带 entropy。
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
] }

[dev-dependencies]
# W7e：用例借 sync 的内存中继与手机一侧（`sync/tests/support`）。
atm-sync-protocol = { path = "../sync-protocol" }
url = "2"
rusqlite = "0.39"
sha2 = "0.10"
