[package]
name = "atm-runtime"
version = "0.0.0"
description = "ATM 3 headless runtime: admission, conversion, authority, Agent entries and jobs"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

# 开发用的无头二进制（W4i）：只给端到端用例与本机联调用，不进安装包。正式宿主（atm-host，W5a 起）链接同一个库。
[[bin]]
name = "atm-runtime"
path = "src/main.rs"

[dependencies]
atm-domain = { path = "../domain" }
atm-http = { path = "../http" }
atm-install-state = { path = "../install-state" }
atm-jobs = { path = "../jobs" }
atm-service = { path = "../service" }
atm-store = { path = "../store" }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
] }

[dev-dependencies]
rusqlite = "0.39"
sha2 = "0.10"
