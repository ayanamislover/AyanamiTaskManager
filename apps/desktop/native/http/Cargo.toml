[package]
name = "atm-http"
version = "0.0.0"
description = "AyanamiTaskManager 3 Agent HTTP: loopback listener, transport guards, Principal::Agent, MCP and Agent REST"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
atm-domain = { path = "../domain" }
atm-service = { path = "../service" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }

[dev-dependencies]
atm-store = { path = "../store" }
