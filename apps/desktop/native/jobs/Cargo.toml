[package]
name = "atm-jobs"
version = "0.0.0"
description = "ATM 3 scheduled jobs: the only crate that builds System principals"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

# 主体构造的静态守卫（domain/tests/principal_guard.rs）只许 `jobs` 目录里构造 System 主体：
# 调度器与它用的客户端存活判定都在这里，运行时只负责起停。
[dependencies]
# W6d：Agent 接入的启动作业（agents.docs、agents.repair）。
atm-agents = { path = "../agents" }
atm-domain = { path = "../domain" }
atm-install-state = { path = "../install-state" }
atm-service = { path = "../service" }
# W5g 更新协调：清单、事务日志与诊断状态是 JSON。
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# metrics 用例对着真实的 git 仓库核对 HEAD。
atm-metrics = { path = "../metrics" }
atm-store = { path = "../store" }
# notify 用例借用服务层验收的夹具（service/tests/support），它还要 rusqlite。
rusqlite = "0.39"
