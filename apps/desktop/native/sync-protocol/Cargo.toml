[package]
name = "atm-sync-protocol"
version = "0.0.0"
description = "ATM 3 phone-sync wire format: space keys, sealed envelopes and parts, document keys, pairing codes and document schemas, byte-compatible with packages/sync-protocol"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
hkdf = "0.12"
hmac = "0.12"
miniz_oxide = "0.8"
serde_json = { workspace = true }
sha2 = "0.10"
url = "2"
