[package]
name = "atm-store"
version = "0.0.0"
description = "AyanamiTaskManager 3 single-database storage layer"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
rusqlite = { version = "0.39", features = ["bundled", "hooks", "functions"] }
sha2 = "0.10"
serde_json = { workspace = true }
# 项目包 `.aytproj`（与 setup 同一版本，只要 deflate）。
zip = { version = "4.6", default-features = false, features = ["deflate"] }
# 与 setup 共用的持久化契约（durable）与启动交接格式（07 §1、§8）。
atm-install-state = { path = "../install-state" }

# 冻结源库：按 SQLite 的锁协议在库文件与 `-shm` 上加字节锁（`detached`）。
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Threading",
] }

[dev-dependencies]
