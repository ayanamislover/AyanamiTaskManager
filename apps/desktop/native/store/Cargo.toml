[package]
name = "atm-store"
version = "0.0.0"
description = "AyanamiTaskManager 3 single-database storage layer"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
rusqlite = { version = "0.39", features = ["bundled", "hooks", "functions"] }
sha2 = "0.10"
# 与 setup 共用的持久化契约（durable）与启动交接格式（07 §1、§8）。
atm-install-state = { path = "../install-state" }

[dev-dependencies]
serde_json = { workspace = true }
