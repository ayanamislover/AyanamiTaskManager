packages:
  - "apps/*"
  - "packages/*"

blockExoticSubdeps: false
nodeLinker: hoisted

allowBuilds:
  # v13 includes the win32 Node-API binary; rebuilding it is unnecessary and
  # makes clean CI installs depend on the runner's Visual Studio version.
  better-sqlite3: false
  electron: true
  electron-winstaller: true
  esbuild: true

minimumReleaseAgeExclude:
  # Security releases pinned below may be newer than a contributor's global
  # minimum-release-age window; these exact versions are intentionally allowed.
  - tmp@0.2.7
  - tar@7.5.21
  - nanoid@3.3.18
  - fastify@5.12.1
  - fast-uri@3.1.6
  - fast-uri@4.1.3
  - qs@6.16.0
  - hono@4.13.5
  - "@xmldom/xmldom@0.9.12"
  - js-yaml@4.3.2

overrides:
  extract-zip@<=2.0.1: npm:@electron-internal/extract-zip@1.0.1
  nanoid@<3.3.18: 3.3.18
  tar@<=7.5.20: 7.5.21
  tmp@<0.2.7: 0.2.7
  # ATM-T-0359 / ATM-R-239: patch-level security fixes for transitive packages
  # (MCP SDK -> ajv/express/hono, fastify -> fast-json-stringify, forge -> plist,
  # eslintrc). Each stays inside its current major.
  fast-uri@>=3 <3.1.6: 3.1.6
  fast-uri@>=4 <4.1.3: 4.1.3
  qs@<6.16.0: 6.16.0
  hono@<4.13.5: 4.13.5
  "@xmldom/xmldom@>=0.9 <0.9.12": 0.9.12
  js-yaml@>=4 <4.3.2: 4.3.2
