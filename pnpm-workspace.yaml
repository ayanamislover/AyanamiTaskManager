packages:
  - "apps/*"
  - "packages/*"

blockExoticSubdeps: false
nodeLinker: hoisted

allowBuilds:
  # v13 includes the win32 Node-API binary; rebuilding it is unnecessary and
  # makes clean CI installs depend on the runner's Visual Studio version.
  better-sqlite3: false
  electron: true
  electron-winstaller: true
  esbuild: true
